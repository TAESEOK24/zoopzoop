spring.application.name=zoopzoop
server.port=8080
spring.profiles.default=local
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

policy.sync.enabled=true
policy.sync.cron=0 0 0 * * *
policy.sync.zone=Asia/Seoul
# Set true to run policy sync when the server shuts down.
policy.sync.on-shutdown.enabled=false
policy.sync.full.per-page=1000
policy.sync.full.max-pages=20
policy.sync.full.page-delay-millis=100
policy.sync.api.max-attempts=3
policy.sync.api.retry-delay-millis=1000


jwt.secret=zoopzoop-secret-key-should-be-long-enough-2026
jwt.access-token-expiration-seconds=1800
jwt.refresh-token-expiration-seconds=86400
jwt.refresh-token-cookie-name=refreshToken
jwt.refresh-token-cookie-secure=false
jwt.refresh-token-cookie-same-site=Lax

oauth.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
oauth.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
oauth.google.authorization-redirect-uri=${GOOGLE_OAUTH_AUTHORIZATION_REDIRECT_URI:http://localhost:3000/auth/google/callback}
oauth.google.auth-uri=https://accounts.google.com/o/oauth2/v2/auth
oauth.google.token-uri=https://oauth2.googleapis.com/token
oauth.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo


# OPEN API KEY
gov.api.key=dcf39234340da7c33c551ad4498ccc496b5f6e153d9d2987ea8665493eacca18
spring.ai.model.chat=openai
spring.ai.openai.api-key=${OPENAI_API_KEY:local-development-placeholder}
spring.ai.openai.base-url=https://api.openai.com
spring.ai.openai.chat.options.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
chatbot.ai.classification-model=${OPENAI_CLASSIFICATION_MODEL:gpt-5.4-nano}
chatbot.ai.answer-model=${OPENAI_ANSWER_MODEL:gpt-4o-mini}
