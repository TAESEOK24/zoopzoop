spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.autoconfigure.exclude=org.springframework.ai.model.openai.autoconfigure.OpenAiAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration

jwt.secret=test-secret-key-that-is-long-enough-for-hmac
jwt.access-token-expiration-seconds=3600
gov.api.key=test-api-key
